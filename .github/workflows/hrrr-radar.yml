# Renders Helmcast's forecast radar frames, hourly.
#
# This file belongs in a SEPARATE PUBLIC repository, not in the app repo.
# Two reasons, both practical:
#
#   - Actions minutes. Private repos get 2,000 free minutes a month; an hourly
#     job would eat most of that. Public repos get unlimited minutes.
#   - GitHub Pages. Free Pages hosting only serves public repos, and Pages is
#     what puts the frames behind a CDN at no cost.
#
# Nothing private is exposed by making it public. It is a script that reads
# public-domain NOAA data and writes weather pictures. No app source, no keys.
#
# Setup is in ../README.md.
name: HRRR forecast radar

on:
  schedule:
    # Ten past the hour. HRRR runs hourly and takes roughly 50 minutes to
    # publish its full forecast window, so this reads the run before last —
    # which is why render.py checks for the LAST forecast hour before
    # committing to a run rather than the first.
    - cron: "10 * * * *"
  workflow_dispatch:

# One at a time. Two overlapping runs would race to publish the same frames.
concurrency:
  group: hrrr-radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Render frames
        run: python render.py --out public

      - name: Publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
